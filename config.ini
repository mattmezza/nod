; Nod defaults. Copy to $XDG_CONFIG_HOME/nod/config.ini (usually
; ~/.config/nod/config.ini) and restart nod after editing.
; Omitted keys use the values below. Lines starting with ; or # are comments.

[layout]
; Dimensions and gaps are in pixels.
width = 500
; 0 removes the body line limit.
max_lines = 5
padding = 14
border_width = 1
; 0 gives square corners.
border_radius = 4
gap_x = 13
gap_y = 38
stack_gap = 10
; top-left, top-right, bottom-left, or bottom-right
position = top-right
; At most 32 notifications can be visible.
max_visible = 5

[card]
show_app = true
show_urgency = true
show_time = true
divider_top = false
divider_bottom = false
; When false, a left click invokes the default action.
action_buttons = true
; Right click and swipe still dismiss the card when this is false.
dismiss_button = true
show_border = true

[stack]
; Fold cards into a deck that unfolds on hover.
collapse = true
; How many pixels each card behind the front card peeks out.
peek = 8
max_peek = 3

[motion]
; Higher values make transitions faster.
anim_speed = 14
; Fraction of the card width needed to dismiss it with a swipe.
swipe_threshold = 0.3

[theme]
; Fontconfig patterns. Size is in points at Xft.dpi (96 by default).
; Use pixelsize for pixel units. mono_font is for headers and timestamps.
font = sans-serif:size=11
mono_font = monospace:size=10
muted_color = #8b949e
; Minimum contrast ratio for text and accents against the card.
min_contrast = 4.5
; Fraction of the accent color mixed into critical backgrounds.
critical_tint = 0.14
; X resources can override the colors and fonts in this file.
use_xresources = true
; Milliseconds between checks. 0 disables polling. SIGUSR1 reloads X resources.
xresources_poll_ms = 2000

; Colors are X11 color names or hex values. Timeouts are in seconds.
; 0 keeps the card visible until dismissed or replaced.
[low]
background = #0d1117
foreground = #c9d1d9
accent = #6e7681
timeout = 5

[normal]
background = #0d1117
foreground = #e6edf3
accent = #79c0ff
timeout = 10

[critical]
background = #0d1117
foreground = #e6edf3
accent = #ffa657
timeout = 0

[dnd]
; Local time. Use off or HH:MM-HH:MM (24-hour clock).
; An earlier end time crosses midnight. Equal times disable the interval.
; Example: monday = 22:00-07:30
sunday = off
monday = off
tuesday = off
wednesday = off
thursday = off
friday = off
saturday = off
; Repeat for each exact app name to mute at all times. Case is ignored.
; Example: muted_app = Example App
muted_app =
