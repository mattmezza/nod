name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.id }}

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker build -t nod-static-build - < .github/static.Dockerfile
          mkdir -p dist
          docker run --rm --volume "$PWD:/src:ro" --volume "$PWD/dist:/dist" nod-static-build \
            sh -ec '
              cp -R /src /tmp/nod-src
              cd /tmp/nod-src
              sh scripts/build-static.sh "$@"
              cp nod-linux-*.tar.gz* /dist/
            ' sh "$GITHUB_REF_NAME" "$ARCH"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nod-${{ matrix.arch }}
          path: dist/nod-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: nod-*
          merge-multiple: true
      - name: Attach archives and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            nod-linux-{x86_64,aarch64}.tar.gz{,.sha256}
